services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: daas
      POSTGRES_PASSWORD: daas
      POSTGRES_DB: daas
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daas"]
      interval: 5s
      retries: 10
volumes:
  pgdata: